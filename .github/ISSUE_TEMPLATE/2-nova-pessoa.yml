name: ➕ Acrescentar uma pessoa
description: Acrescentar um filho ou uma filha na árvore
title: "Nova pessoa: "
labels: ["sugestão", "nova pessoa"]
body:
  - type: markdown
    attributes:
      value: "Acrescente um filho ou uma filha que ainda não está na árvore.\n\n⚠️ **Esta sugestão fica pública na internet.** Não escreva telefone, endereço, e-mail, CPF/RG nem datas completas de pessoas vivas (para elas, informe só o ano). Nada é publicado no site antes de ser revisado por quem mantém a árvore."
  - type: input
    id: pai
    attributes:
      label: "Pai ou mãe"
      description: "Preenchido automaticamente. Não altere."
    validations:
      required: true
  - type: input
    id: nome
    attributes:
      label: "Nome da nova pessoa"
      description: "Nome completo."
    validations:
      required: true
  - type: input
    id: ordem
    attributes:
      label: "Ordem de nascimento"
      description: "1 para o primeiro filho, 2 para o segundo… Deixe em branco se não souber."
    validations:
      required: false
  - type: input
    id: nascimento
    attributes:
      label: "Nascimento"
      description: "Data e local. Para pessoas vivas, só o ano e o local."
    validations:
      required: false
  - type: input
    id: falecimento
    attributes:
      label: "Falecimento"
      description: "Se já faleceu."
    validations:
      required: false
  - type: input
    id: conjuge
    attributes:
      label: "Cônjuge"
    validations:
      required: false
  - type: input
    id: casamento
    attributes:
      label: "Casamento"
    validations:
      required: false
  - type: textarea
    id: historia
    attributes:
      label: "História ou lembrança"
      description: "Opcional."
    validations:
      required: false
  - type: dropdown
    id: fonte
    attributes:
      label: "Fonte da informação"
      description: "Como você sabe disso?"
      options:
        - "Certidão ou documento oficial"
        - "Registro de imigração / lista de navio"
        - "Registro de igreja (batismo, casamento)"
        - "Conheço pessoalmente (sou a pessoa ou parente próximo)"
        - "Relato de outro familiar"
        - "Outra"
    validations:
      required: true
  - type: input
    id: fonte_detalhe
    attributes:
      label: "Detalhe da fonte"
      description: "Ex.: certidão de casamento do cartório de Jaciguá, livro 3, folha 20; ou “minha avó contou”."
      placeholder: "Opcional, mas ajuda muito"
    validations:
      required: false
  - type: input
    id: quem
    attributes:
      label: "Quem está enviando"
      description: "Seu nome e parentesco (ex.: “Ana, neta de José”)."
    validations:
      required: true
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: "Confirmações"
      options:
        - label: "As informações são verdadeiras, até onde sei."
          required: true
        - label: "Não incluí telefone, endereço, documentos nem datas completas de pessoas vivas."
          required: true
    validations:
      required: true
