name: ✏️ Corrigir ou completar dados
description: Corrigir ou acrescentar informações de uma pessoa da árvore
title: "Correção: "
labels: ["sugestão", "correção"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por ajudar a árvore! 🌳 Os campos já vêm com o que está no site: **altere só o que estiver errado ou faltando**. Para apagar uma informação errada, escreva `APAGAR` no campo.\n\n⏳ **A mudança não aparece na hora.** Toda sugestão é conferida por um robô e aprovada por quem mantém a árvore antes de entrar no site, o que pode levar alguns dias. Fotos e documentos são sempre revisados pessoalmente. Você recebe um aviso aqui quando sua sugestão for aplicada.\n\n⚠️ **Esta sugestão fica pública na internet.** Não escreva telefone, endereço, e-mail, CPF/RG nem datas completas de pessoas vivas (para elas, informe só o ano). Nada é publicado no site antes de ser revisado por quem mantém a árvore."
  - type: input
    id: pessoa
    attributes:
      label: "Pessoa"
      description: "Preenchido automaticamente. Não altere."
    validations:
      required: true
  - type: input
    id: nome_completo
    attributes:
      label: "Nome completo"
      description: "Nome completo, como nos documentos."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "#### 🔒 Por que o site mostra só o **ano** de nascimento de quem pode estar vivo?\nÉ uma regra de privacidade para pessoas nascidas há menos de 100 anos:\n1. **Fraude e roubo de identidade:** nome completo, data de nascimento e nomes dos pais são exatamente o que bancos, operadoras e serviços públicos usam para confirmar quem é a pessoa — e o site é público e aparece no Google.\n2. **Crianças:** a LGPD (art. 14) exige cuidado especial com dados de crianças; datas completas ligadas aos nomes dos pais não devem ficar expostas.\n3. **É o padrão da genealogia:** FamilySearch, MyHeritage e Ancestry escondem dados de pessoas vivas. As datas completas dos antepassados continuam aparecendo.\n\n**Esta sugestão também é pública.** Para pessoas vivas, informe aqui só o **ano**. Se quiser guardar a data completa no arquivo privado da família, fale diretamente com quem mantém o site."
  - type: input
    id: nascimento_data
    attributes:
      label: "Data de nascimento"
      description: "dd/mm/aaaa, ou só o ano (use ~ se for aproximado: ~1890). Pessoa viva: só o ano."
      placeholder: "ex.: 11/02/1925  ou  2024"
    validations:
      required: false
  - type: input
    id: nascimento_local
    attributes:
      label: "Local de nascimento"
      description: "Cidade ou distrito e estado (ou país)."
      placeholder: "ex.: Jaciguá, Cachoeiro de Itapemirim - ES"
    validations:
      required: false
  - type: input
    id: falecimento_data
    attributes:
      label: "Data de falecimento"
      description: "Só se a pessoa já faleceu. dd/mm/aaaa, ou só o ano (use ~ se for aproximado: ~1890)."
    validations:
      required: false
  - type: input
    id: falecimento_local
    attributes:
      label: "Local de falecimento"
      description: "Cidade ou distrito e estado (ou país)."
    validations:
      required: false
  - type: textarea
    id: unioes
    attributes:
      label: "Cônjuge(s) / uniões"
      description: "Uma pessoa por linha, na ordem. Entre parênteses, se quiser: início, fim, separação. Ex.:\nMaria Silva (1975–1990, separados)\nAna Souza (desde 2001)\nPara pessoas vivas o site mostra só os nomes; datas e separações ficam guardadas no arquivo privado."
    validations:
      required: false
  - type: input
    id: outro_genitor
    attributes:
      label: "Outro pai/mãe"
      description: "Só para filhos: o pai ou a mãe que não é desta família. Deixe em branco se o pai/mãe da árvore teve uma única união."
    validations:
      required: false
  - type: input
    id: casamento_data
    attributes:
      label: "Data do casamento"
      description: "dd/mm/aaaa, ou só o ano (use ~ se for aproximado: ~1890). Pessoa viva: só o ano."
    validations:
      required: false
  - type: input
    id: casamento_local
    attributes:
      label: "Local do casamento"
      description: "Cidade e, se souber, a igreja ou o cartório."
    validations:
      required: false
  - type: input
    id: residencia
    attributes:
      label: "Onde morou"
      description: "Só para quem já faleceu: cidade ou região onde viveu."
    validations:
      required: false
  - type: textarea
    id: observacao
    attributes:
      label: "Outra correção ou informação"
      description: "Qualquer outra correção (ordem dos irmãos, grafia do nome…)."
    validations:
      required: false
  - type: textarea
    id: historia
    attributes:
      label: "História ou lembrança"
      description: "Uma lembrança, a profissão, de onde veio… Vai para a seção “História”."
    validations:
      required: false
  - type: dropdown
    id: fonte
    attributes:
      label: "Fonte da informação"
      description: "Como você sabe disso?"
      options:
        - "Certidão ou documento oficial"
        - "Registro de imigração / lista de navio"
        - "Registro de igreja (batismo, casamento)"
        - "Conheço pessoalmente (sou a pessoa ou parente próximo)"
        - "Relato de outro familiar"
        - "Outra"
    validations:
      required: true
  - type: input
    id: fonte_detalhe
    attributes:
      label: "Detalhe da fonte"
      description: "Ex.: certidão de casamento do cartório de Jaciguá, livro 3, folha 20; ou “minha avó contou”."
      placeholder: "Opcional, mas ajuda muito"
    validations:
      required: false
  - type: input
    id: quem
    attributes:
      label: "Quem está enviando"
      description: "Seu nome e parentesco (ex.: “Ana, neta de José”)."
    validations:
      required: true
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: "Confirmações"
      options:
        - label: "As informações são verdadeiras, até onde sei."
          required: true
        - label: "Não incluí telefone, endereço, documentos nem datas completas de pessoas vivas."
          required: true
    validations:
      required: true
